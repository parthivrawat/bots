[project]
name = "week2-scheduled-bot"
version = "0.2.0"
description = "Scheduled automation bot with background jobs and API integration"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "python-telegram-bot>=21.0",
    "discord.py>=2.4",
    "slack-bolt>=1.20",
    "asyncpraw>=7.7",
    "apscheduler>=3.10",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
