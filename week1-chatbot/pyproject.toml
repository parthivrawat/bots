[project]
name = "week1-chatbot"
version = "0.1.0"
description = "Platform-agnostic chat bot core with Telegram + Discord adapters"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "python-telegram-bot>=21.0",
    "discord.py>=2.4",
    "slack-bolt>=1.20",
    "asyncpraw>=7.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
